name: keep-awake

# Streamlit Community Cloud puts an app to sleep after 12 hours without visitors, and a
# sleeping app shows a "get this app back up" button instead of the dashboard. This opens the
# dashboard in a headless browser twice a day, clicking that button if it's there, so the
# app is always awake: once in the morning after the data refresh, once in the evening.
on:
  schedule:
    - cron: "30 14 * * *" # 14:30 UTC = 6:30-7:30am Pacific, after refresh-data
    - cron: "30 2 * * *" # 02:30 UTC = 6:30-7:30pm Pacific
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://clippers-home-court-h46at8hpdebg9gdcaunm87.streamlit.app
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Visit the dashboard
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(os.environ["APP_URL"], wait_until="domcontentloaded", timeout=60_000)
              page.wait_for_timeout(10_000)
              wake = page.get_by_role("button", name="get this app back up")
              if wake.count():
                  print("App was asleep; waking it up.")
                  wake.first.click()
                  page.wait_for_timeout(90_000)  # give it time to boot
              else:
                  print("App is awake.")
          EOF
